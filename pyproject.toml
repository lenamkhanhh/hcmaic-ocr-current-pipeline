[project]
name = "hcmaic"
version = "0.1.0"
description = "HCMAIC 2026 local keyframe-search MVP (fork of SoftSignals AIC2025, MIT)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
dependencies = [
    "fastapi>=0.115,<1",
    "python-multipart>=0.0.9,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.8,<3",
    "numpy>=1.26,<3",
    "pillow>=12.3,<13",
    "pyyaml>=6.0,<7",
    "pyarrow>=15,<20",
]

[project.optional-dependencies]
clip = [
    "torch>=2.2",
    "transformers>=4.44,<5",
    # <3.4.9: later builds drop __version__, which requests' compat check needs
    "charset-normalizer>=3.3,<3.4.9",
]
faiss = [
    "faiss-cpu>=1.8",
]
video = [
    "opencv-python-headless>=4.9",
]
media = [
    "kagglehub>=0.3,<1",
]
elastic = [
    "elasticsearch>=8.13,<9",
]

[project.scripts]
hcmaic = "hcmaic.cli.main:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.10",
    # video ingestion tests generate and read tiny fixture videos
    "opencv-python-headless>=4.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hcmaic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/hcmaic"]
omit = ["src/hcmaic/embedding/clip_real.py", "src/hcmaic/indexing/faiss_index.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["upstream_reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = false
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = false
exclude = ["upstream_reference/"]

[[tool.mypy.overrides]]
module = ["faiss", "faiss.*", "torch", "torch.*", "transformers", "transformers.*", "PIL", "PIL.*", "cv2", "cv2.*"]
ignore_missing_imports = true
